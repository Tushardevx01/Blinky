[package]
name = "sutra-predict"
version = "0.1.0"
edition = "2021"
authors = ["Sutra Core Team"]
description = "Predictive Analytics, Workflow Pattern Recognition, and Next-Action Intelligence for Sutra"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.12", features = ["v4", "serde"] }
rusqlite = { version = "0.33", features = ["bundled"] }
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.17"
